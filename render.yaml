services:
  - type: web
    name: gymcontrol
    runtime: docker
    plan: free
    dockerfilePath: ./gymcontrol/Dockerfile
    dockerContext: ./gymcontrol
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_KEY
        generateValue: true
      - key: JWT_EXPIRATION
        value: "900000"
      - key: DB_POOL_SIZE
        value: "5"
